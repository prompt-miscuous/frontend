<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpectraView</title>
<style>
:root{
  --bg:#070a10; --glass:rgba(13,19,25,.74); --glass2:rgba(22,30,38,.72); --line:rgba(190,215,215,.14); --line2:rgba(190,215,215,.26);
  --tx:#eef1ee; --tx2:#a3aeae; --tx3:#7b8788; --teal:#74bdb4; --teal2:#5ea69e; --tealbg:rgba(116,189,180,.13); --amber:#d09a55; --err:#f0a08a;
  --ui:"Inter","Segoe UI","Helvetica Neue","DejaVu Sans",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
html{font-size:16px} html.big{font-size:18.5px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:0.875rem/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
body.hc{--glass:rgba(4,7,10,.96);--glass2:rgba(14,20,26,.98);--line:rgba(255,255,255,.45);--line2:rgba(255,255,255,.7);--tx2:#e2e8e8;--tx3:#c5cece;--teal:#8fe0d5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 12px 40px rgba(0,0,0,.35)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}

/* ---------- header ---------- */
#top{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:22px;padding:0 40px;background:rgba(9,13,18,.55);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:center;gap:14px;font-size:1.45rem;font-weight:500;letter-spacing:.01em}
.brand svg{width:40px;height:40px}
.brand em{font-style:normal;color:var(--teal)}
.sp{flex:1}
.seg{display:flex;align-items:center;gap:10px;font-size:.92rem}
.seg button{color:var(--tx3);padding:4px 2px} .seg button.on{color:var(--tx);font-weight:600} .seg button:hover{color:var(--tx)}
.seg i{font-style:normal;color:var(--tx3)}
#btnA11y{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:.9rem}
#btnA11y:hover,#btnA11y.on{background:var(--tealbg);border-color:var(--teal)}
#a11y{position:fixed;right:40px;top:72px;z-index:40;border-radius:14px;padding:10px 6px;min-width:230px;display:none}
#a11y.on{display:block}
#a11y label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer} #a11y label:hover{background:var(--tealbg)}
input[type=checkbox]{accent-color:var(--teal);width:1rem;height:1rem;margin:0}

/* ---------- main card ---------- */
#card{position:fixed;left:64px;top:128px;width:380px;max-height:calc(100% - 150px);overflow:auto;border-radius:18px;padding:26px 24px 22px;z-index:10;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;transition:transform .35s ease,opacity .35s ease}
#card.min{transform:translateX(calc(-100% - 70px));opacity:0;pointer-events:none}
#cardTab{position:fixed;left:0;top:128px;z-index:11;border-radius:0 12px 12px 0;padding:12px 10px;display:none}
#card.min + #cardTab{display:block}
#cardMin{position:absolute;right:12px;top:12px;color:var(--tx3);width:28px;height:28px;border-radius:8px} #cardMin:hover{background:var(--tealbg);color:var(--tx)}
h1{font:400 1.5rem/1.28 var(--serif);margin:0 0 20px;letter-spacing:-.005em;padding-right:14px;text-wrap:balance} h1 .dim{color:var(--tx2)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3)}
#q{width:100%;height:42px;border-radius:10px;border:1px solid transparent;background:rgba(150,170,175,.13);padding:0 34px 0 40px;outline:none}
#q::placeholder{color:var(--tx3)} #q:focus{border-color:var(--teal2);background:rgba(150,170,175,.17)}
#qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--tx3);display:none;border-radius:6px} #qx:hover{color:var(--tx)}
#sug{position:absolute;left:0;right:0;top:46px;border-radius:10px;z-index:5;display:none;overflow:hidden;background:rgba(16,23,30,.97)}
#sug.on{display:block}
#sug button{display:flex;width:100%;gap:10px;align-items:baseline;padding:8px 13px;text-align:left} #sug button.act,#sug button:hover{background:var(--tealbg)}
#sug small{color:var(--tx3);margin-left:auto;white-space:nowrap;font-size:.75rem}
#qmsg{min-height:1.1rem;font-size:.78rem;color:var(--tx3);margin:5px 2px 6px} #qmsg.er{color:var(--err)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.types button{height:82px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.84rem;color:var(--tx2)}
.types button svg{width:38px;height:38px;stroke-width:1.1}
.types button:hover{border-color:var(--line2);color:var(--tx)}
.types button.on{border-color:var(--teal);background:var(--tealbg);color:var(--tx)}
.lbl{font-size:.82rem;color:var(--tx2);margin:0 0 8px 3px;display:flex;justify-content:space-between}
.lbl b{font:500 .78rem var(--mono);color:var(--teal)}
.dual{position:relative;height:26px}
.dual .trk{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:4px;background:linear-gradient(90deg,#6d62c4 0%,#6b5f8f 30%,#8b6a55 62%,#d09a55 100%)}
.dual .cut{position:absolute;top:9px;height:8px;background:rgba(7,10,16,.72)} .dual .cut.l{left:0;border-radius:4px 0 0 4px} .dual .cut.r{right:0;border-radius:0 4px 4px 0}
.dual input{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.dual input::-webkit-slider-runnable-track{background:none;height:26px}
.dual input::-moz-range-track{background:none;height:26px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:24px;border-radius:5px;background:#aeb4b8;border:1px solid #e3e7e8;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:ew-resize;margin-top:1px}
.dual input::-moz-range-thumb{pointer-events:auto;width:18px;height:22px;border-radius:5px;background:#aeb4b8;border:1px solid #e3e7e8;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:ew-resize}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--tx2);margin:4px 2px 16px}
#cta{width:100%;height:42px;border-radius:10px;background:var(--teal);color:#0d2422;font-weight:600;font-size:.95rem;transition:background .15s}
#cta:hover{background:#8ad0c6} #cta:disabled{opacity:.6;cursor:progress}
.note{text-align:center;color:var(--tx3);font-size:.78rem;margin:10px 0 14px}
.up{display:flex;justify-content:center}
.up button{display:flex;gap:8px;align-items:center;text-decoration:underline;text-underline-offset:3px;color:var(--tx2);font-size:.84rem} .up button:hover{color:var(--tx)}
#list{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:none}
#list.on{display:block}
#list .hd{display:flex;justify-content:space-between;font-size:.78rem;color:var(--tx2);margin-bottom:8px} #list .hd button{text-decoration:underline;color:var(--tx3)}
#chips{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 6px 3px 10px;font-size:.78rem}
.chip.on{border-color:var(--teal);background:var(--tealbg)} .chip span{cursor:pointer} .chip button{color:var(--tx3);width:16px} .chip button:hover{color:var(--tx)}

/* ---------- reticle ---------- */
#ret{position:fixed;left:0;top:0;width:0;height:0;z-index:5;pointer-events:none;display:none}
#ret svg{position:absolute;left:-60px;top:-60px;width:120px;height:120px;overflow:visible}
#ret .ring{opacity:0;transition:opacity .4s} #ret.lock .ring{opacity:1}
#ret.lock .r2{animation:pulse 2.4s ease-in-out infinite;transform-origin:60px 60px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.35}}
body.still #ret.lock .r2{animation:none}
#retLbl{position:absolute;left:22px;top:18px;white-space:nowrap;background:rgba(10,14,19,.72);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.8rem;color:var(--tx)}
#ret.lock #retLbl{display:none}
#retLbl b{font-weight:600} #retLbl span{font-family:var(--mono);font-size:.74rem;color:var(--tx2)}

/* ---------- spectrum panel ---------- */
#spec{position:fixed;right:70px;bottom:96px;width:min(540px,calc(100vw - 520px));min-width:400px;border-radius:14px;padding:14px 16px 12px;z-index:12;display:none}
#spec.on{display:block}
#spec header{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
#spec h2{margin:0;font:400 1.15rem var(--serif)} #spec header p{margin:2px 0 0;font:.74rem var(--mono);color:var(--tx2)}
.tag{display:inline-block;font-size:.68rem;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--tx2);margin:6px 6px 0 0;font-family:var(--ui)}
.tag.t{color:var(--teal);border-color:rgba(116,189,180,.5)} .tag.a{color:var(--amber);border-color:rgba(208,154,85,.5)}
#spec .x{margin-left:auto;width:28px;height:28px;border-radius:8px;color:var(--tx3)} #spec .x:hover{background:var(--tealbg);color:var(--tx)}
#chartBox{position:relative;height:270px}
#chart{width:100%;height:100%;display:block;cursor:crosshair}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--tx2);font-size:.84rem}
#load .bar{width:180px;height:4px;border-radius:2px;background:rgba(150,170,175,.2);overflow:hidden} #load .bar i{display:block;height:100%;width:0;background:var(--teal)}
#spec footer{display:flex;align-items:center;gap:12px;font-size:.76rem;color:var(--tx3);margin-top:4px}
#spec footer button{margin-left:auto;text-decoration:underline;color:var(--tx2)} #spec footer button:hover{color:var(--tx)}

/* ---------- legend + zoom ---------- */
#corner{position:fixed;right:28px;bottom:26px;display:flex;align-items:flex-end;gap:14px;z-index:9}
#legend{border-radius:10px;padding:10px 16px;font-size:.84rem;display:grid;gap:5px}
#legend span{display:flex;align-items:center;gap:10px} #legend i{width:10px;height:10px;border-radius:50%}
#zoom{display:grid;gap:4px} #zoom button{width:34px;height:34px;border-radius:8px;font-size:1.25rem;line-height:1}
#zoom button:hover{border-color:var(--teal)}

/* ---------- expert tools ---------- */
.xp{display:none} body.expert .xp{display:block}
#read{position:fixed;left:50%;top:76px;transform:translateX(-50%);border-radius:999px;padding:5px 16px;font:.74rem var(--mono);color:var(--tx2);z-index:8;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#read b{color:var(--tx);font-weight:500}
#dock{position:fixed;right:28px;top:120px;width:272px;border-radius:14px;z-index:11;max-height:calc(100% - 250px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#dock .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
#dock .tabs button{padding:10px 0 8px;font-size:.74rem;color:var(--tx3);border-bottom:2px solid transparent;display:grid;justify-items:center;gap:3px}
#dock .tabs button:hover{color:var(--tx)} #dock .tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
#dock section{padding:14px 14px 14px;display:none} #dock section.on{display:block}
#dock.shut section{display:none}
.frm{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.frm label{color:var(--tx2);font-size:.8rem} .frm em{font-style:normal;color:var(--tx3);font:.72rem var(--mono)}
.inp,select.inp{height:30px;border-radius:7px;border:1px solid var(--line);background:rgba(150,170,175,.1);padding:0 8px;width:100%;min-width:0;outline:none;font-family:var(--mono);font-size:.8rem}
select.inp{font-family:var(--ui)} .inp:focus{border-color:var(--teal2)} select.inp option{background:#141b22}
.er{grid-column:1/4;color:var(--err);font-size:.76rem}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line2);font-size:.8rem} .btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#0d2422;font-weight:600}
.url{margin-top:10px;font:.7rem var(--mono);color:var(--tx3);word-break:break-all}
.lay{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px} .lay label{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.82rem} .lay label:hover{background:var(--tealbg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.8rem;margin-bottom:10px} .kv span{color:var(--tx2)} .kv b{font:500 .8rem var(--mono);text-align:right}
input[type=range].pl{width:100%;accent-color:var(--teal);margin:4px 0}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);border-radius:999px;padding:8px 18px;z-index:50;display:none;font-size:.84rem}

@media (max-width:980px){
  #top{padding:0 16px;gap:12px;height:56px} .brand{font-size:1.15rem;gap:8px} .brand svg{width:30px;height:30px} #btnA11y span{display:none} #a11y{right:12px;top:62px}
  #card{left:12px;top:68px;width:min(366px,calc(100vw - 24px));max-height:calc(100% - 150px);padding:20px 18px 16px} #cardTab{top:68px} h1{font-size:1.4rem;margin-bottom:14px}
  #spec{left:10px;right:10px;bottom:10px;width:auto;min-width:0} #chartBox{height:210px}
  #corner{right:10px;bottom:10px} #legend{display:none} body.specOpen #corner{display:none}
  #dock{right:10px;top:104px;width:min(272px,calc(100vw - 20px))} #read{top:62px}
}
@media (max-width:560px){ .seg.mode i{display:none} .brand span{display:none} }
</style>
</head>
<body>
<canvas id="map" aria-label="Sky map"></canvas>

<header id="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="12" fill="#3b4a4f"/><path d="M9.5 15c5 1.5 14 1.5 21 0M8.5 21c6 2 16 2 23 0M11 27c5 1.5 12 1.5 18 0" stroke="#74bdb4" stroke-width="1.3" opacity=".8"/><ellipse cx="20" cy="20" rx="18" ry="5.5" transform="rotate(-24 20 20)" stroke="#9fb3b3" stroke-width="1.2"/></svg>
    <span>Spectra<em>View</em></span>
  </div>
  <div class="sp"></div>
  <div class="seg" id="langSeg"><button data-lang="es">ES</button><i>/</i><button data-lang="en">EN</button></div>
  <div class="seg mode" id="modeSeg"><button data-mode="simple" data-t="simple"></button><i>|</i><button data-mode="expert" data-t="expert"></button></div>
  <button id="btnA11y" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-t="a11y"></span></button>
</header>
<div id="a11y" class="glass">
  <label><input type="checkbox" id="aHc"><span data-t="aHc"></span></label>
  <label><input type="checkbox" id="aBig"><span data-t="aBig"></span></label>
  <label><input type="checkbox" id="aStill"><span data-t="aStill"></span></label>
</div>

<div id="read" class="glass xp"></div>

<!-- ===== Main card ===== -->
<main id="card" class="glass">
  <button id="cardMin" data-tt="hide"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1><span data-t="h1a"></span><br><span data-t="h1b"></span><span class="dim" data-t="h1c"></span></h1>
  <div class="search">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" data-ph="ph" aria-label="Search">
    <button id="qx" aria-label="Clear">✕</button>
    <div id="sug" class="glass" role="listbox"></div>
  </div>
  <div id="qmsg"></div>
  <div class="types" id="types">
    <button data-type="star"><svg class="i" viewBox="0 0 32 32"><path d="M13 5c.8 5.2 2.8 7.2 8 8-5.2.8-7.2 2.800-8 8-.8-5.200-2.800-7.200-8-8 5.200-.8 7.200-2.800 8-8zM24 18c.4 2.600 1.400 3.600 4 4-2.600.4-3.600 1.400-4 4-.4-2.600-1.400-3.600-4-4 2.600-.4 3.600-1.400 4-4zM24.500 4.500v4M22.500 6.500h4"/></svg><span data-t="star"></span></button>
    <button data-type="gal"><svg class="i" viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="3.200" ry="2.200" transform="rotate(-20 16 16)"/><path d="M16 11.500c5-1.500 10 1 10 5 0 2.500-2 4.500-4.500 5M16 20.500c-5 1.500-10-1-10-5 0-2.500 2-4.500 4.500-5M21.500 13.500c2.500 3 .5 8-4.500 9.500-3.500 1-6.500 0-8-1.500M10.500 18.500c-2.500-3-.5-8 4.500-9.500 3.500-1 6.500 0 8 1.500"/></svg><span data-t="gal"></span></button>
  </div>
  <div class="lbl"><span data-t="wl"></span><b id="wlTxt"></b></div>
  <div class="dual"><div class="trk"></div><div class="cut l" id="cutL"></div><div class="cut r" id="cutR"></div>
    <input type="range" id="wl0" min="0.75" max="5" step="0.05" aria-label="λ min"><input type="range" id="wl1" min="0.75" max="5" step="0.05" aria-label="λ max"></div>
  <div class="ends"><span>0.75 µm</span><span>5 µm</span></div>
  <button id="cta" data-t="cta"></button>
  <div class="note" data-t="note"></div>
  <div class="up"><button id="upBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg><span data-t="upload"></span></button><input type="file" id="upFile" accept=".csv,.txt,text/plain,text/csv" hidden></div>
  <div id="list"><div class="hd"><span id="listTtl"></span><button id="listClr" data-t="clear"></button></div><div id="chips"></div></div>
</main>
<button id="cardTab" class="glass" data-tt="show"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>

<!-- ===== Reticle ===== -->
<div id="ret"><svg viewBox="0 0 120 120" fill="none" stroke="#e9f3f1" stroke-width="1.2">
  <path d="M60 28v24M60 68v24M28 60h24M68 60h24" opacity=".9"/><circle cx="60" cy="60" r="2" fill="#fff" stroke="none"/>
  <g class="ring"><circle cx="60" cy="60" r="24" opacity=".9"/><circle class="r2" cx="60" cy="60" r="34" stroke="#74bdb4"/></g></svg>
  <div id="retLbl"></div></div>

<!-- ===== Spectrum ===== -->
<section id="spec" class="glass" aria-live="polite">
  <header><div><h2 id="spName"></h2><p id="spPos"></p><div id="spTags"></div></div><button class="x" id="spX" aria-label="Close">✕</button></header>
  <div id="chartBox"><canvas id="chart"></canvas><div id="load"><span data-t="loading"></span><div class="bar"><i id="loadBar"></i></div></div></div>
  <footer><span id="spFoot"></span><button id="spCsv" data-t="csv"></button></footer>
</section>

<!-- ===== Expert dock ===== -->
<aside id="dock" class="glass xp">
  <div class="tabs" id="tabs">
    <button data-tab="region"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" stroke-dasharray="3 2"/><path d="M12 9v6M9 12h6"/></svg><span data-t="tRegion"></span></button>
    <button data-tab="layers"><svg class="i" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></svg><span data-t="tLayers"></span></button>
    <button data-tab="view"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c-3.500 4-3.500 12 0 16M12 4c3.500 4 3.500 12 0 16"/></svg><span data-t="tView"></span></button>
    <button data-tab="time"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.500V12l3 2"/></svg><span data-t="tTime"></span></button>
  </div>
  <section data-sec="region">

  function header(){ if(!cur) return; const tg=cur.tg, p=targetPos(tg), cov=Catalog.coverage(Astro.vec(p.ra,p.dec)), cls=targetCls(tg);
    $('spName').textContent=targetName(tg); $('spPos').textContent=`${Astro.hms(p.ra,1)}  ${Astro.dms(p.dec)}  ·  ${p.ra.toFixed(4)}° ${(p.dec<0?'−':'+')+Math.abs(p.dec).toFixed(4)}°`;
    $('spTags').innerHTML=`<span class="tag">${esc(t('T')[cls==='custom'?(state.type==='gal'?'gal':'star'):cls]||'')}</span><span class="tag ${cov==='deep'?'a':cov?'t':''}">${cov==='deep'?t('lgDeep'):cov?t('lgData'):t('noCov')}</span><span class="tag">${t('sim')}</span>`;
    $('spFoot').textContent=`${t('range')} ${state.wl[0].toFixed(2)}–${state.wl[1].toFixed(2)} µm · ${t('sim').toLowerCase()}`; }
  function open(tg){ clearTimeout(timer); cur=make(tg); hover=null; header(); $('spec').classList.add('on'); document.body.classList.add('specOpen'); $('dock').classList.add('shut'); $('load').style.display='flex'; $('chart').style.visibility='hidden';
    const bar=$('loadBar'); bar.style.transition='none'; bar.style.width='0'; const dur=state.a11y.still?250:1100; requestAnimationFrame(()=>{ bar.style.transition=`width ${dur}ms linear`; bar.style.width='100%'; });
    timer=setTimeout(()=>{ $('load').style.display='none'; $('chart').style.visibility='visible'; draw(); },dur+60); }
  function close(){ clearTimeout(timer); cur=null; $('spec').classList.remove('on'); document.body.classList.remove('specOpen'); $('dock').classList.remove('shut'); state.locked=false; $('ret').classList.remove('lock'); SkyMap.setFocus(null); }
  function csv(){ if(!cur) return; const rows=['wavelength_um,flux_jy_simulated',...cur.wl.map((l,i)=>l.toFixed(4)+','+cur.fl[i].toPrecision(5))].join('\n'), a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([rows],{type:'text/csv'})); a.download='spectrum_simulated_'+targetName(cur.tg).replace(/[^\w]+/g,'_')+'.csv'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
  function init(){ $('spX').onclick=close; $('spCsv').onclick=csv; const cv=$('chart');
    cv.addEventListener('pointermove',ev=>{ hover=ev.clientX-cv.getBoundingClientRect().left; draw(); }); cv.addEventListener('pointerleave',()=>{ hover=null; draw(); });
    window.addEventListener('resize',draw); bus.on('wl',()=>{ header(); draw(); }); bus.on('lang',()=>{ header(); draw(); }); bus.on('a11y',draw);
    bus.on('target',()=>{ if(cur && cur.tg!==state.target) close(); }); }
  return {init,open,close,isOpen:()=>!!cur};
})();

/* =====================================================================
   Region — RA / Dec / Size / Band  <->  URL  (original user story)
   ===================================================================== */
const Region = (() => {
  const validate = (ra,dec,size,band) => !isFinite(ra)||ra<0||ra>360 ? t('eRa') : !isFinite(dec)||dec<-90||dec>90 ? t('eDec')
    : !isFinite(size)||size<=CONFIG.SIZE_MIN_EXCL||size>CONFIG.SIZE_MAX ? t('eSize').replace('{a}',CONFIG.SIZE_MIN_EXCL).replace('{b}',CONFIG.SIZE_MAX).replace('{u}',CONFIG.SIZE_UNIT) : !CONFIG.BANDS.some(b=>b.id===band) ? t('eBand') : '';
  const query = r => `?ra=${fmtNum(r.ra)}&dec=${fmtNum(r.dec)}&size=${fmtNum(r.size)}&band=${encodeURIComponent(r.band)}`;
  function readUrl(){ const q=new URLSearchParams(location.search), r={...CONFIG.DEFAULT_ROI};
    const num=(key,ok)=>{ if(q.has(key)&&q.get(key).trim()!==''){ const v=Number(q.get(key)); if(isFinite(v)&&ok(v)) r[key]=v; } };
    num('ra',v=>v>=0&&v<=360); num('dec',v=>v>=-90&&v<=90); num('size',v=>v>CONFIG.SIZE_MIN_EXCL&&v<=CONFIG.SIZE_MAX);
    const b=(q.get('band')||'').toUpperCase(); if(CONFIG.BANDS.some(x=>x.id===b)) r.band=b; return r; }
  function writeUrl(){ try{ history.replaceState(null,'',query(state.roi)); }catch(e){} }
  function fill(){ const r=state.roi; $('rRa').value=fmtNum(r.ra); $('rDec').value=fmtNum(r.dec); $('rSize').value=fmtNum(r.size); $('rBand').value=r.band; $('rErr').textContent=''; $('rUrl').textContent=query(r); }
  function set(patch){ Object.assign(state.roi,patch); writeUrl(); fill(); bus.emit('roi'); }
  function submit(){ const v=['rRa','rDec','rSize'].map(i=>$(i).value.trim()===''?NaN:Number($(i).value)), band=$('rBand').value, er=validate(v[0],v[1],v[2],band); if(er){ $('rErr').textContent=er; return; }
    set({ra:v[0],dec:v[1],size:v[2],band}); state.layers.roi=true; bus.emit('ui'); App.setTarget(App.nearest(v[0],v[1])||{ra:v[0],dec:v[1]},{fly:true,fov:roiDeg()*CONFIG.ROI_FIT,keepRoi:true}); }
  function copy(){ const tx=location.href.split('?')[0].split('#')[0]+query(state.roi), ok=()=>toast(t('copied'));
    const fb=()=>{ const ta=document.createElement('textarea'); ta.value=tx; ta.style.cssText='position:fixed;opacity:0'; document.body.append(ta); ta.select(); let d=false; try{ d=document.execCommand('copy'); }catch(e){} ta.remove(); d?ok():toast(tx); };
    navigator.clipboard&&window.isSecureContext ? navigator.clipboard.writeText(tx).then(ok,fb) : fb(); }
  function init(){ $('rUnit').textContent=CONFIG.SIZE_UNIT; CONFIG.BANDS.forEach(b=>$('rBand').add(new Option(b.label,b.id)));
    $('rApply').onclick=submit; $('rCopy').onclick=copy; $('rReset').onclick=()=>{ set({...CONFIG.DEFAULT_ROI}); submit(); };
    $('rMap').onclick=()=>{ const c=SkyMap.center(); $('rRa').value=fmtNum(c[0]); $('rDec').value=fmtNum(c[1]); };
    document.querySelector('[data-sec=region]').addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.tagName!=='BUTTON') submit(); });
    state.roi=readUrl(); writeUrl(); fill(); }
  return {init,set,fill};
})();

/* =====================================================================
   App — card, search, list upload, expert dock, header
   ===================================================================== */
const App = (() => {
  let sugItems=[], sugIdx=-1, list=store.get('list',[]);
  const nearest = (ra,dec) => { const v=Astro.vec(ra,dec); let best=null,bd=Math.cos(0.05*D2R); for(const o of Object.values(Catalog.O)){ if(o.kind==='planet') continue; const d=v[0]*o.v[0]+v[1]*o.v[1]+v[2]*o.v[2]; if(d>bd){bd=d;best=o;} } return best?{obj:best}:null; };
  function parseCoords(s){ const c=s.trim().replace(/−/g,'-'); let m=c.match(/^([+-]?\d+(?:\.\d+)?)\s*°?\s*[,;\s]\s*([+-]?\d+(?:\.\d+)?)\s*°?$/);
    if(m){ const ra=+m[1], dec=+m[2]; return ra>=0&&ra<=360&&dec>=-90&&dec<=90 ? {ra,dec} : null; }
    m=c.match(/^(\d{1,2})\s*[h:\s]\s*(\d{1,2})\s*[m:\s]\s*(\d+(?:\.\d+)?)\s*s?\s*[,;\s]\s*([+-]?)(\d{1,2})\s*[°d:\s]\s*(\d{1,2})\s*[′'m:\s]\s*(\d+(?:\.\d+)?)?\s*[″"s]?$/i);
    if(m){ const ra=(+m[1]+m[2]/60+m[3]/3600)*15, dec=(m[4]==='-'?-1:1)*(+m[5]+m[6]/60+(+m[7]||0)/3600); return ra<=360&&Math.abs(dec)<=90 ? {ra,dec} : null; } return null; }
  function resolve(s){ const c=parseCoords(s); if(c) return nearest(c.ra,c.dec)||c; const r=Catalog.search(s,1); return r.length?{obj:r[0]}:null; }
  const flyFov = tg => tg.obj ? (tg.obj.kind==='dso' ? Math.max(1.2,Math.min(14,tg.obj.size*4.2)) : tg.obj.kind==='planet'?12:9) : 9;

  function setTarget(tg, opt={}){ state.target=tg; state.locked=false; $('ret').classList.remove('lock'); const p=targetPos(tg);
    if(tg.obj){ if(tg.obj.cls==='star'||tg.obj.cls==='gal'){ state.type=tg.obj.cls; } }
    if(!opt.keepRoi) Region.set({ra:+p.ra.toFixed(5),dec:+p.dec.toFixed(5)});
    if(!opt.keepText) $('q').value=tg.obj?Catalog.label(tg.obj):`${fmtNum(p.ra)} ${fmtNum(p.dec)}`; $('qx').style.display=$('q').value?'block':'none'; msg(''); syncCard(); bus.emit('target');
    if(opt.fly) SkyMap.flyTo(p.ra,p.dec,opt.fov||flyFov(tg),opt.done); else opt.done&&opt.done(); }
  function syncCard(){ document.querySelectorAll('#types button').forEach(b=>b.classList.toggle('on', state.target&&state.target.obj ? b.dataset.type===state.target.obj.cls : b.dataset.type===state.type));
    const tg=state.target; if(tg){ const p=targetPos(tg); $('retLbl').innerHTML=`<b>${esc(targetName(tg))}</b> <span>${Astro.hms(p.ra)} ${Astro.dms(p.dec)}</span>`; }
    document.querySelectorAll('#chips .chip').forEach((c,i)=>c.classList.toggle('on', !!tg && sameTarget(list[i],tg))); }
  const sameTarget = (it,tg) => it.id ? !!tg.obj&&tg.obj.id===it.id : !tg.obj&&Math.abs(it.ra-tg.ra)<1e-6&&Math.abs(it.dec-tg.dec)<1e-6;
  const msg = (s,er) => { const m=$('qmsg'); m.textContent=s||t('hint'); m.classList.toggle('er',!!er); };

  function suggest(){ const s=$('q').value; $('qx').style.display=s?'block':'none'; sugItems=parseCoords(s)?[]:Catalog.search(s); sugIdx=-1; const el=$('sug');
    el.innerHTML=sugItems.map((o,i)=>`<button role="option" data-i="${i}"><span>${esc(Catalog.label(o))}</span><small>${esc(t('T')[o.cls])}</small></button>`).join(''); el.classList.toggle('on',sugItems.length>0); }
  function go(spectrum){ $('sug').classList.remove('on'); const s=$('q').value.trim(); let tg=state.target;
    if(s && !(tg && s===(tg.obj?Catalog.label(tg.obj):`${fmtNum(tg.ra)} ${fmtNum(tg.dec)}`))){ tg=sugIdx>=0?{obj:sugItems[sugIdx]}:resolve(s); if(!tg){ msg(t('notFound'),true); return; } }
    if(!tg){ const c=SkyMap.center(); tg=nearest(c[0],c[1])||{ra:c[0],dec:c[1]}; }
    if(spectrum){ const W=window.innerWidth, H=window.innerHeight;
      if(W>980){ const sw=Math.max(400,Math.min(540,W-520)), sl=W-70-sw, cr2=$('card').classList.contains('min')?0:$('card').getBoundingClientRect().right; if(sl-cr2<170) $('card').classList.add('min');
        SkyMap.setFocus({x:((sl-cr2<170?0:cr2)+sl)/2, y:Math.max(150,H-96-385)}); }
      else { $('card').classList.add('min'); SkyMap.setFocus({x:W/2, y:(56+Math.max(200,H-330))/2}); } }
    const after=()=>{ if(!spectrum) return; state.locked=true; $('ret').classList.add('lock'); Spectrum.open(state.target); };
    $('cta').disabled=!!spectrum; setTarget(tg,{fly:true,done:()=>{ $('cta').disabled=false; after(); }}); }

  function renderList(){ $('list').classList.toggle('on',list.length>0); $('listTtl').textContent=`${t('myList')} (${list.length})`;
    $('chips').innerHTML=list.map((it,i)=>`<span class="chip"><span data-i="${i}">${esc(it.id?Catalog.label(Catalog.O[it.id]):it.name||`${fmtNum(it.ra)} ${fmtNum(it.dec)}`)}</span><button data-x="${i}" aria-label="Remove">✕</button></span>`).join(''); syncCard(); }
  function importList(text){ let add=0, skip=0; for(const raw of text.split(/\r?\n/)){ const ln=raw.trim(); if(!ln||ln[0]==='#') continue; const parts=ln.split(/[,;\t]/).map(x=>x.trim()).filter(Boolean); let it=null;
      const c=parseCoords(parts.length>=3?parts.slice(-2).join(' '):ln);
      if(c) it={ra:c.ra,dec:c.dec,name:parts.length>=3?parts[0].slice(0,40):''}; else { const r=Catalog.search(parts[0],1); if(r.length&&Catalog.norm(parts[0]).length>1) it={id:r[0].id}; }
      if(!it){ if(!/^(name|nombre|ra|object|objeto)\b/i.test(ln)) skip++; continue; }
      if(!list.some(x=>it.id?x.id===it.id:!x.id&&x.ra===it.ra&&x.dec===it.dec)&&list.length<200){ list.push(it); add++; } }
    store.set('list',list); renderList(); toast(`${add} ${t('added')}${skip?` · ${skip} ${t('skipped')}`:''}`); }
  const fromItem = it => it.id ? {obj:Catalog.O[it.id]} : {ra:it.ra,dec:it.dec,name:it.name};

  function applyLang(){ document.documentElement.lang=LANG; document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t)); document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=t(el.dataset.ph));
    document.querySelectorAll('[data-tt]').forEach(el=>{ el.title=t(el.dataset.tt); el.setAttribute('aria-label',t(el.dataset.tt)); });
    document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
    $('lay').innerHTML=Object.keys(t('L')).map(key=>`<label><input type="checkbox" data-l="${key}"${state.layers[key]?' checked':''}><span>${t('L')[key]}</span></label>`).join('');
    const fillSel=(id,dict,val)=>{ const s=$(id); s.innerHTML=''; Object.entries(dict).forEach(([v,l])=>s.add(new Option(l,v))); s.value=val; };
    fillSel('vProj',t('P'),state.view.proj); fillSel('vFrame',t('F'),state.view.frame); fillSel('tRate',t('R'),state.time.rate);
    const tg=state.target; if(tg&&tg.obj) $('q').value=Catalog.label(tg.obj); msg(''); syncCard(); renderList(); timeUi(); wlUi(); bus.emit('lang'); bus.emit('ui'); }
  function applyMode(){ document.body.classList.toggle('expert',state.mode==='expert'); document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode)); store.set('mode',state.mode); bus.emit('ui'); }
  function applyA11y(){ const a=state.a11y; document.body.classList.toggle('hc',a.hc); document.documentElement.classList.toggle('big',a.big); document.body.classList.toggle('still',a.still);
    $('aHc').checked=a.hc; $('aBig').checked=a.big; $('aStill').checked=a.still; store.set('a11y',a); bus.emit('a11y'); }
  function wlUi(){ const [a,b]=CONFIG.WL, w=state.wl; $('wl0').value=w[0]; $('wl1').value=w[1]; $('cutL').style.width=((w[0]-a)/(b-a)*100)+'%'; $('cutR').style.width=((b-w[1])/(b-a)*100)+'%'; $('wlTxt').textContent=`${w[0].toFixed(2)} – ${w[1].toFixed(2)} µm`; }
  function timeUi(){ const tm=state.time, d=new Date(tm.sim), p2=Astro.p2, off=(tm.sim-Date.now())/3600000;
    $('tUtc').textContent=`${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`; $('tMjd').textContent=Astro.mjd(tm.sim).toFixed(5);
    $('tOff').textContent=Math.abs(off)<0.01?'0':(off>0?'+':'−')+(Math.abs(off)>=48?(Math.abs(off)/24).toFixed(1)+' d':Math.abs(off).toFixed(1)+' h');
    if(document.activeElement!==$('tSl')) $('tSl').value=Math.max(-720,Math.min(720,off)); $('tPlay').textContent=tm.playing?t('pause'):t('play'); }

  function init(){
    SkyMap.init(); Region.init(); Spectrum.init();
    // header
    document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; store.set('lang',LANG); applyLang(); });
    document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{ state.mode=b.dataset.mode; applyMode(); });
    $('btnA11y').onclick=ev=>{ ev.stopPropagation(); const on=$('a11y').classList.toggle('on'); $('btnA11y').classList.toggle('on',on); };
    document.addEventListener('pointerdown',ev=>{ if(!$('a11y').contains(ev.target)&&!$('btnA11y').contains(ev.target)){ $('a11y').classList.remove('on'); $('btnA11y').classList.remove('on'); } if(!ev.target.closest('.search')) $('sug').classList.remove('on'); });
    [['aHc','hc'],['aBig','big'],['aStill','still']].forEach(([id,key])=>$(id).onchange=ev=>{ state.a11y[key]=ev.target.checked; applyA11y(); });
    // card
    $('cardMin').onclick=()=>$('card').classList.add('min'); $('cardTab').onclick=()=>$('card').classList.remove('min');
    $('q').addEventListener('input',suggest); $('q').addEventListener('focus',()=>{ if($('q').value) suggest(); });
    $('q').addEventListener('keydown',ev=>{ const n=sugItems.length;
      if(ev.key==='ArrowDown'&&n){ ev.preventDefault(); sugIdx=(sugIdx+1)%n; } else if(ev.key==='ArrowUp'&&n){ ev.preventDefault(); sugIdx=(sugIdx-1+n)%n; } else if(ev.key==='Enter'){ ev.preventDefault(); if(sugIdx<0&&n&&$('sug').classList.contains('on')) sugIdx=0; go(false); return; } else if(ev.key==='Escape'){ $('sug').classList.remove('on'); return; } else return;
      document.querySelectorAll('#sug button').forEach((b,i)=>b.classList.toggle('act',i===sugIdx)); });
    $('sug').addEventListener('pointerdown',ev=>{ const b=ev.target.closest('button'); if(b){ ev.preventDefault(); sugIdx=+b.dataset.i; go(false); } });
    $('qx').onclick=()=>{ $('q').value=''; suggest(); $('q').focus(); };
    document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{ state.type=b.dataset.type; if(state.target&&state.target.obj&&state.target.obj.cls!==state.type){ const p=targetPos(state.target); state.target=null; $('q').value=''; $('qx').style.display='none'; setTarget({ra:p.ra,dec:p.dec},{keepRoi:true,keepText:true}); $('q').value=''; } else syncCard(); bus.emit('target'); });
    const wlIn=which=>ev=>{ let a=+$('wl0').value, b=+$('wl1').value; if(b-a<0.2){ if(which===0) a=b-0.2; else b=a+0.2; } state.wl=[+a.toFixed(2),+b.toFixed(2)]; store.set('wl',state.wl); wlUi(); bus.emit('wl'); };
    $('wl0').oninput=wlIn(0); $('wl1').oninput=wlIn(1);
    $('cta').onclick=()=>go(true);
    $('upBtn').onclick=()=>$('upFile').click(); $('upFile').onchange=ev=>{ const fl=ev.target.files[0]; if(!fl) return; const rd=new FileReader(); rd.onload=()=>importList(String(rd.result)); rd.readAsText(fl); ev.target.value=''; };
    $('chips').addEventListener('click',ev=>{ const x=ev.target.closest('[data-x]'), s=ev.target.closest('[data-i]'); if(x){ list.splice(+x.dataset.x,1); store.set('list',list); renderList(); } else if(s) setTarget(fromItem(list[+s.dataset.i]),{fly:true}); });
    $('listClr').onclick=()=>{ list=[]; store.set('list',list); renderList(); };
    list=list.filter(it=>!it.id||Catalog.O[it.id]);
    // zoom
    $('zIn').onclick=()=>SkyMap.zoom(1/1.6); $('zOut').onclick=()=>SkyMap.zoom(1.6);
    // dock
    const tab=name=>{ store.set('tab',name); $('dock').classList.remove('shut'); document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name)); document.querySelectorAll('#dock section').forEach(s=>s.classList.toggle('on',s.dataset.sec===name)); };
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab)); tab(store.get('tab','region'));
    $('lay').addEventListener('change',ev=>{ const key=ev.target.dataset.l; if(key){ state.layers[key]=ev.target.checked; store.set('layers',state.layers); bus.emit('ui'); } });
    bus.on('ui',()=>document.querySelectorAll('#lay input').forEach(i=>i.checked=state.layers[i.dataset.l]));
    $('vProj').onchange=ev=>{ state.view.proj=ev.target.value; state.view.fov=clampFov(state.view.fov); bus.emit('ui'); }; $('vFrame').onchange=ev=>{ state.view.frame=ev.target.value; bus.emit('ui'); };
    const rot=d=>{ state.view.roll=Astro.mod(state.view.roll+d+180,360)-180; bus.emit('ui'); }; $('vL').onclick=()=>rot(-15); $('vR').onclick=()=>rot(15);
    $('vHome').onclick=()=>{ state.view.roll=0; state.view.proj='stereo'; state.view.frame='icrs'; $('vProj').value='stereo'; $('vFrame').value='icrs'; SkyMap.flyTo(state.roi.ra,state.roi.dec,CONFIG.LANDING_FOV); };
    // time
    $('tSl').oninput=ev=>{ state.time.sim=Date.now()+ev.target.value*3600000; timeUi(); bus.emit('time'); };
    $('tPlay').onclick=()=>{ state.time.playing=!state.time.playing; timeUi(); }; $('tRate').onchange=ev=>{ state.time.rate=+ev.target.value; };
    $('tNow').onclick=()=>{ state.time.sim=Date.now(); state.time.rate=1; $('tRate').value=1; state.time.playing=true; timeUi(); bus.emit('time'); };
    let last=performance.now(), tick=-1; const loop=now=>{ const dt=Math.min(250,now-last); last=now; const tm=state.time;
      if(tm.playing){ tm.sim+=dt*tm.rate; const s=Math.floor(now/(tm.rate>1?60:1000)); if(s!==tick){ tick=s; if(state.mode==='expert') timeUi(); if(tm.rate>1||s%30===0){ bus.emit('time'); if(state.target&&state.target.obj&&state.target.obj.kind==='planet') syncCard(); } } } requestAnimationFrame(loop); }; requestAnimationFrame(loop);
    // keyboard
    document.addEventListener('keydown',ev=>{ if(/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)||ev.ctrlKey||ev.metaKey||ev.altKey) return;
      if(ev.key==='+'||ev.key==='=') SkyMap.zoom(1/1.3); else if(ev.key==='-') SkyMap.zoom(1.3); else if(ev.key==='/'){ ev.preventDefault(); $('card').classList.remove('min'); $('q').focus(); } else if(ev.key==='Escape'&&Spectrum.isOpen()) Spectrum.close();
      else if(ev.key==='ArrowLeft') SkyMap.pan(50,0); else if(ev.key==='ArrowRight') SkyMap.pan(-50,0); else if(ev.key==='ArrowUp') SkyMap.pan(0,50); else if(ev.key==='ArrowDown') SkyMap.pan(0,-50); });
    // initial state: region from URL, preloaded target (WISE 0855 by default)
    state.view.ra=state.roi.ra; state.view.dec=state.roi.dec;
    applyA11y(); applyMode(); applyLang(); setTarget(nearest(state.roi.ra,state.roi.dec)||{ra:state.roi.ra,dec:state.roi.dec},{keepRoi:true,keepText:true}); $('q').value=''; $('qx').style.display='none';
  }
  return {init,setTarget,nearest};
})();
App.init();
